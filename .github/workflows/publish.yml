name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist on main)'
        required: true
        type: string

# Publishing uses npm Trusted Publishing (OIDC), not a token. The account has 2FA
# on, so a granular token only works when it is created with "bypass 2FA", and
# npm is retiring that: account changes since Aug 2026, direct publishing from
# Jan 2027. Three such tokens have already expired or been revoked under us — the
# last one, intodns-mcp-ci, was revoked on 2026-08-04 and every publish after it
# failed with a misleading `E404 PUT .../intodns-mcp`, not an auth error. OIDC has
# nothing to expire. The trusted publisher is configured on npmjs.com under the
# package's Settings and must name this repository, this workflow file and the
# environment below (none).
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
      # Trusted publishing needs npm 11.5.1 or newer to mint the OIDC credential.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
